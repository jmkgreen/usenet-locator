services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      USENET_LOCATOR_CONFIG: /config/config.json
      USENET_LOCATOR_DATABASE_URL: postgresql://usenet_locator:${POSTGRES_PASSWORD:?set in .env}@db:5432/usenet_locator?sslmode=disable
      USENET_LOCATOR_NNTP_USERNAME: ${NNTP_USERNAME:?set in .env}
      USENET_LOCATOR_NNTP_PASSWORD: ${NNTP_PASSWORD:?set in .env}
    volumes:
      - ./config.local.json:/config/config.json:ro
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:16-bookworm
    environment:
      POSTGRES_DB: usenet_locator
      POSTGRES_USER: usenet_locator
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U usenet_locator -d usenet_locator"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "127.0.0.1:5432:5432"
volumes:
  postgres-data:
