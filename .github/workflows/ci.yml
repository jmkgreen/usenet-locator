name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.x'
      - run: go test -race -covermode=atomic -coverprofile coverage.out ./backend/internal/...
      - name: Enforce 80% backend coverage
        run: go tool cover -func coverage.out | awk '/^total:/ { if ($3 + 0 < 80) exit 1 }'
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm audit --prod --audit-level=high
        working-directory: frontend
      - run: pnpm audit --audit-level=high
        working-directory: frontend
      - run: pnpm run build
        working-directory: frontend
      - run: pnpm test
        working-directory: frontend
  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create disposable smoke-test configuration and secrets
        run: |
          cp deploy/config.example.json deploy/config.local.json
          mkdir -p deploy/secrets
          printf '%s\n' 'smoke-only-password' > deploy/secrets/postgres-password
          printf '%s\n' 'postgresql://usenet_locator:smoke-only-password@db:5432/usenet_locator?sslmode=disable' > deploy/secrets/database-url
          for secret in \
            nntp-provider-a-username nntp-provider-a-password \
            nntp-provider-b-username nntp-provider-b-password \
            nntp-provider-c-username nntp-provider-c-password \
            nntp-primary-username nntp-primary-password; do
            printf '%s\n' 'unused' > "deploy/secrets/$secret"
          done
      - run: docker compose -f deploy/compose.yaml up --build --detach --wait
      - run: curl --fail --retry 10 --retry-connrefused http://127.0.0.1:8080/readyz
      - run: curl --fail http://127.0.0.1:8080/
      - if: always()
        run: docker compose -f deploy/compose.yaml down --volumes --remove-orphans
  database-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_DB: integration
          POSTGRES_USER: integration
          POSTGRES_PASSWORD: integration
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U integration -d integration"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      USENET_LOCATOR_TEST_DATABASE_URL: postgresql://integration:integration@localhost:5432/integration?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.x'
      - run: go test ./backend/internal/integration/...
